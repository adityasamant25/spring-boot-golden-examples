# Explicitly configures target environment for ESC installation
# If not set, then it's calculated automatically
# Possible values: TOMS, TBAPI, MANO, RBM
#resilience_agent_target=TOMS

# Configures TBAPI_HOME folder (which contains jar and conf files) for installation on TBAPI servers
# If not set, then it's calculated automatically if possible
#TBAPI_HOME=/u02/netcracker/tbapi/telecom-business-api

# Configures filename (not path) of TBAPI config file (which contains JAVA_OPTS) for installation on TBAPI servers
# If not set, then it's calculated automatically if possible
#resilience_agent_tbapi_config_file=telecom-business-api.conf

# Configures Tomcat folder name (inside $NETCRACKER_HOME) for configuring javaagent option.
# If the value is blank, then javaagent is not configured for Tomcat.
# default: tomcat*
#resilience_agent_tomcat_folder_mask=tomcat*
